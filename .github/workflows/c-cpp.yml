name: C/C++ CI


on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: apt
      run: sudo apt-get update && sudo apt-get install g++ cmake lcov libboost-all-dev clang-format
    - name: lint
      run: bash linter.sh
    - name: test
      run: ./build.sh -t
